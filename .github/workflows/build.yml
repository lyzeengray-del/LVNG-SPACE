
name: Build LVNG-X APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Rebuild LVNG-X
    runs-on: ubuntu-latest

    steps:
      - name: Download Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android Build Tools
        run: |
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          yes | sdkmanager --licenses || true
          echo "$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_PATH"

      - name: Install Python and apktool
        run: |
          sudo apt-get update
          sudo apt-get install -y python3
          curl -fL -o apktool.jar \
            https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar
          echo '#!/bin/sh' > apktool
          echo 'exec java -jar "$GITHUB_WORKSPACE/apktool.jar" "$@"' >> apktool
          chmod +x apktool
          echo "$GITHUB_WORKSPACE" >> "$GITHUB_PATH"

      - name: Check Project Files
        run: |
          test -f original/app-debug.apk
          test -f assets/lvngx-logo.png
          test -f scripts/build.sh
          test -f scripts/patch_apk.py

      - name: Build and Sign LVNG-X
        run: |
          chmod +x scripts/build.sh
          bash scripts/build.sh

      - name: Upload LVNG-X APK
        uses: actions/upload-artifact@v4
        with:
          name: LVNG-X-APK
          path: output/LVNG-X.apk
          if-no-files-found: error
          retention-days: 30
