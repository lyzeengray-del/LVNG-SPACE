
name: Extract and Build LVNG-X

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Extract Source and Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check Source ZIP
        run: |
          if [ ! -f source.zip ]; then
            echo "ERROR: source.zip tidak ditemukan!"
            exit 1
          fi

      - name: Extract Source ZIP
        run: |
          mkdir -p extracted
          unzip -q source.zip -d extracted

          echo "=== Isi ZIP ==="
          ls -la extracted

      - name: Find Android Project
        run: |
          GRADLE_FILE=$(find extracted -type f -name gradlew | head -n 1)

          if [ -z "$GRADLE_FILE" ]; then
            echo "ERROR: gradlew tidak ditemukan!"
            echo "Pastikan ZIP berisi source project Android."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLE_FILE")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project ditemukan: $PROJECT_DIR"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android SDK Packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          yes | sdkmanager --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Android APK
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Collect APK
        run: |
          mkdir -p output

          find extracted -type f \
            -path "*/build/outputs/apk/debug/*.apk" \
            -exec cp {} output/LVNG-X.apk \;

          if [ ! -f output/LVNG-X.apk ]; then
            echo "ERROR: APK hasil build tidak ditemukan!"
            exit 1
          fi

      - name: Upload LVNG-X APK
        uses: actions/upload-artifact@v4
        with:
          name: LVNG-X-APK
          path: output/LVNG-X.apk
          if-no-files-found: error
          retention-days: 30
          
